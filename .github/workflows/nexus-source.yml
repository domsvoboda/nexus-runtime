name: Nexus Proton source checks
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded source-test tools
        timeout-minutes: 12
        run: |
          sudo "$(command -v node)" nexus/ci/ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake make rsync gcc g++ gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-i686
      - run: node nexus/check-source.mjs
      - run: node --test nexus/*.test.mjs nexus/tests/*.test.mjs nexus/runtime-compat/*.test.mjs
      - run: git diff --check
